name: CI - Deploy to CloudHub

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17
      - name: Configure Maven Settings
        uses: whelk-io/maven-settings-xml-action@v22
        with:
          servers: >
            [
              {
                "id": "anypoint-exchange-v3",
                "username": "${{ secrets.CONNECTED_APP_CLIENT_ID }}",
                "password": "${{ secrets.CONNECTED_APP_CLIENT_SECRET }}",
                "configuration": {
                  "httpConfiguration": {
                    "all": {
                      "usePreemptive": "true"
                    }
                  }
                }
              },
              {
                "id": "mulesoft-enterprise",
                "username": "${{ secrets.CONNECTED_APP_CLIENT_ID }}",
                "password": "${{ secrets.CONNECTED_APP_CLIENT_SECRET }}",
                "configuration": {
                  "httpConfiguration": {
                    "all": {
                      "usePreemptive": "true"
                    }
                  }
                }
              }
            ]
      - name: Build with Maven
        env:
          ANYPOINT_CLIENTID: ${{ secrets.CONNECTED_APP_CLIENT_ID }}
          ANYPOINT_CLIENTSECRET: ${{ secrets.CONNECTED_APP_CLIENT_SECRET }}
        run: |
          mvn -B package --file pom.xml \
          -DskipMunitTests \
          -Danypoint.clientId=$ANYPOINT_CLIENTID \
          -Danypoint.clientSecret=$ANYPOINT_CLIENTSECRET \
          -Danypoint.platform.client_id=$ANYPOINT_CLIENTID \
          -Danypoint.platform.client_secret=$ANYPOINT_CLIENTSECRET
      - name: Stamp artifact file name with commit hash
        run: |
          artifactName1=$(ls target/*.jar | head -1)
          commitHash=$(git rev-parse --short "$GITHUB_SHA")
          artifactName2=$(ls target/*.jar | head -1 | sed "s/.jar/-$commitHash.jar/g")
          mv $artifactName1 $artifactName2
      - name: Upload artifact 
        uses: actions/upload-artifact@v4
        with:
          name: artifacts
          path: target/*.jar

  deploy:
      needs: build
      runs-on: ubuntu-latest
      steps:    
      - name: Checkout this repo
        uses: actions/checkout@v4
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: artifacts
      - name: Configure Maven Settings
        uses: whelk-io/maven-settings-xml-action@v22
        with:
          servers: >
            [
              {
                "id": "anypoint-exchange-v3",
                "username": "${{ secrets.CONNECTED_APP_CLIENT_ID }}",
                "password": "${{ secrets.CONNECTED_APP_CLIENT_SECRET }}"
              },
              {
                "id": "mulesoft-enterprise",
                "username": "${{ secrets.CONNECTED_APP_CLIENT_ID }}",
                "password": "${{ secrets.CONNECTED_APP_CLIENT_SECRET }}"
              }
            ]
      - name: Deploy to Exchange
        env:
          USERNAME: ${{ secrets.CONNECTED_APP_CLIENT_ID }}
          PASSWORD: ${{ secrets.CONNECTED_APP_CLIENT_SECRET }}
        run: |
          artifactName=$(ls *.jar | head -1)
          mvn deploy -DskipMunitTests \
          -Dmule.artifact=$artifactName \
          -Danypoint.clientId="$USERNAME" \
          -Danypoint.clientSecret="$PASSWORD"
      - name: Deploy to Sandbox
        env:
          USERNAME: ${{ secrets.CONNECTED_APP_CLIENT_ID }}
          PASSWORD: ${{ secrets.CONNECTED_APP_CLIENT_SECRET }}
        run: |
          artifactName=$(ls *.jar | head -1)
          mvn deploy -DskipMunitTests -DmuleDeploy \
          -Dmule.artifact=$artifactName \
          -Danypoint.clientId="$USERNAME" \
          -Danypoint.clientSecret="$PASSWORD"