name: CI - Deploy to CloudHub

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Create Maven Settings
        uses: s4u/maven-settings-action@v2
        with:
          servers: |
            [{
              "id": "anypoint-exchange-v3",
              "username": "${{ secrets.CONNECTED_APP_CLIENT_ID }}",
              "password": "${{ secrets.CONNECTED_APP_CLIENT_SECRET }}"
            }]

      - name: Deploy to CloudHub
        env:
          ANYPOINT_CLIENTID: ${{ secrets.CONNECTED_APP_CLIENT_ID }}
          ANYPOINT_SECRET: ${{ secrets.CONNECTED_APP_CLIENT_SECRET }}
        run: |
          mvn clean deploy -DskipTests \
          -DmuleDeploy \
          -Danypoint.connectedapp.clientid=${ANYPOINT_CLIENTID} \
          -Danypoint.connectedapp.clientsecret=${ANYPOINT_SECRET}