name: CI - Deploy to CloudHub

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Deploy to Exchange
        run: mvn clean deploy -DclientID=64bb47a8a101421ea46e35dc9099d5bc -DclientSecret=195Eb9d7921F4605B7D9C34AA8B8f020 -s settings.xml

      - name: Deploy to CloudHub
        run: mvn clean deploy -DmuleDeploy -DtargetName=Cloudhub-US-East-2 -Denvironment=Sandbox -Dreplicas=1 -DvCores=0.1 -DappName=s-layer-rjaencobos -DclientID=64bb47a8a101421ea46e35dc9099d5bc -DclientSecret=195Eb9d7921F4605B7D9C34AA8B8f020 -s settings.xml
