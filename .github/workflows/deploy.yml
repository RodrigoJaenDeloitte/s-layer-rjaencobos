name: CI - Deploy to CloudHub

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v3
      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: 17
      - name: Build with Maven
        run: mvn -B package --file pom.xml -DskipMunitTests
      - name: Stamp artifact file name with commit hash
        run: |
          artifactName1=$(ls target/*.jar | head -1)
          commitHash=$(git rev-parse --short "$GITHUB_SHA")
          artifactName2=$(ls target/*.jar | head -1 | sed "s/.jar/-$commitHash.jar/g")
          mv $artifactName1 $artifactName2
      - name: Upload artifact 
        uses: actions/upload-artifact@v3
        with:
            name: artifacts
            path: target/*.jar

  deploy:
      needs: build
      runs-on: ubuntu-latest
      steps:    
      - name: Checkout this repo
        uses: actions/checkout@v3
      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      - uses: actions/download-artifact@v3
        with:
          name: artifacts
      - name: maven-settings-xml-action 
        uses: whelk-io/maven-settings-xml-action@v20
        env:
          USERNAME: ${{ secrets.CONNECTED_APP_CLIENT_ID }}
          PASSWORD: ${{ secrets.CONNECTED_APP_CLIENT_SECRET }}
        with:
          servers: '[{ "id": "anypoint-exchange-v3", "username": "~~~Client~~~", "password": "64bb47a8a101421ea46e35dc9099d5bc~?~195Eb9d7921F4605B7D9C34AA8B8f020" }]'
      - name: Deploy to Exchange
        run: |
          cat /home/runner/.m2/settings.xml
          artifactName=$(ls *.jar | head -1)
          mvn deploy -DskipMunitTests \
          -s /home/runner/.m2/settings.xml \
          -Dmule.artifact=$artifactName \
          -Danypoint.clientId="$USERNAME" \
          -Danypoint.clientSecret="$PASSWORD" \
      - name: Deploy to Sandbox
        run: |
          artifactName=$(ls *.jar | head -1)
          mvn deploy -DskipMunitTests -DmuleDeploy \
          -Dmule.artifact=$artifactName \
          -Danypoint.clientId="$USERNAME" \
          -Danypoint.clientSecret="$PASSWORD" \
